[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-timer"
version = "0.1.0"
description = "Local event-sourced tkinter task timer"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "tkcalendar>=1.6.1",
    "tzlocal>=5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
timeout = 60
timeout_method = "thread"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
pretty = true
show_error_codes = true
warn_unused_configs = true
ignore_missing_imports = true
