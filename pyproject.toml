[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle"
version = "0.2.0"
description = "Local transactional SQLite Tkinter task timer"
requires-python = ">=3.11"
dependencies = [
    "tzdata==2026.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "tkcalendar>=1.6.1", "tzlocal>=5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chronicle*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
